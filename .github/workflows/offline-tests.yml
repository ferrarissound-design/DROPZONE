name: DROPZONE offline regression
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y liblua5.4-0
      - name: Run offline regression suite
        run: python3 tests/run.py
      - name: Run game-balance analysis
        run: python3 tests/preplay_analysis.py
